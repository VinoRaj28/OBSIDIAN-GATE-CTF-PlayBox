services:
  web:
    build: ./web
    ports:
      - "8081:80"
    environment:
      - DB_HOST=db
      - DB_USER=veriportal
      - DB_PASS=veriportal_pw
      - DB_NAME=veriportal
    depends_on:
      - db
  db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=rootpw
      - MYSQL_DATABASE=veriportal
      - MYSQL_USER=veriportal
      - MYSQL_PASSWORD=veriportal_pw
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
